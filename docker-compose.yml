services:
  app:
    image: "${COMPOSE_PROJECT_NAME:-smart-bike}-backend-app:latest"
    build:
      context: ./backend
      dockerfile: docker/php/Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    working_dir: /var/www/html
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-smart_bike_rental}
      DB_USERNAME: ${DB_USERNAME:-smart_bike}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      RUN_SEED_ON_DEPLOY: ${RUN_SEED_ON_DEPLOY:-false}
    volumes:
      - app-public:/var/www/html/public
      - app-storage:/var/www/html/storage
      - ./backend/.env:/var/www/html/.env
    depends_on:
      - db
    restart: unless-stopped

  queue:
    image: "${COMPOSE_PROJECT_NAME:-smart-bike}-backend-app:latest"
    working_dir: /var/www/html
    command: php artisan queue:work database --queue=default --sleep=1 --tries=3 --timeout=120 --max-time=3600
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-smart_bike_rental}
      DB_USERNAME: ${DB_USERNAME:-smart_bike}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - app-public:/var/www/html/public
      - app-storage:/var/www/html/storage
      - ./backend/.env:/var/www/html/.env
    depends_on:
      - app
      - db
    restart: unless-stopped

  scheduler:
    image: "${COMPOSE_PROJECT_NAME:-smart-bike}-backend-app:latest"
    working_dir: /var/www/html
    command: php artisan schedule:work
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-smart_bike_rental}
      DB_USERNAME: ${DB_USERNAME:-smart_bike}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - app-public:/var/www/html/public
      - app-storage:/var/www/html/storage
      - ./backend/.env:/var/www/html/.env
    depends_on:
      - app
      - db
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-8001}:80"
    volumes:
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app-public:/var/www/html/public:ro
      - app-storage:/var/www/html/storage:ro
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: mariadb:10.11
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-smart_bike_rental}
      MYSQL_USER: ${DB_USERNAME:-smart_bike}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "${DB_PORT_EXTERNAL:-3307}:3306"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    profiles:
      - tunnel
    depends_on:
      - web
    restart: unless-stopped

volumes:
  app-public:
  app-storage:
  db-data:
